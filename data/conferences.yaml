# Conferences for multi-robot systems research: dedicated multi-robot / swarm / multi-agent
# venues (area: mrs), general robotics flagships (robotics, the default), and the control
# (control) and AI / planning / learning (ai) venues where multi-robot work routinely appears.
# Schema: see CLAUDE.md. Keep at least the most recent PAST edition with a paper
# deadline for every venue — the renderer predicts future deadlines from it.
# Dates are ISO (YYYY-MM-DD). status: confirmed | tentative | unverified.

